  <g fill="#20382d" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="middle"><text x="237" y="76">BUY</text><text x="237" y="117">SELL</text></g>
  <g fill="#53634e" font-family="Arial,Helvetica,sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing=".5"><text x="45" y="157">MARKET</text><text x="140" y="157">ENGINE</text><text x="237" y="157">ORDERS</text></g>
